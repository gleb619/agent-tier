<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>at — Offline</title>
    <meta http-equiv="refresh" content="30;url=/" />
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9fafb;
        color: #111827;
        padding: 1rem;
      }
      .card {
        max-width: 20rem;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 0.5rem;
        padding: 1.5rem;
        text-align: center;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1rem;
        color: #4b5563;
        font-size: 0.875rem;
      }
      a {
        display: inline-block;
        background: #2563eb;
        color: white;
        text-decoration: none;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Offline</h1>
      <p>You are currently offline. Queued runs will start automatically when the connection returns.</p>
      <a href="/">Return to dashboard</a>
    </div>
  </body>
</html>
